experiment:
  name: "sanity_check_patient_020_zonal"
  description: "Single-patient 2D zonal anatomy segmentation sanity check using patient 020"
  output_dir: "./results/020_zonal"

data:
  dataset_root: "dataset/prostate158_train/train"
  patient_ids:
    - "020"
  modalities:
    - "t2"
  target_mask: "t2_anatomy_reader1.nii.gz"
  raw_image_size: [270, 270]
  slice_sampling: "all"

model:
  architecture: "ProstateUNet2D"
  in_channels: 1
  out_channels: 3
  init_features: 32
  dropout_rate: 0.2

training:
  batch_size: 4
  learning_rate: 0.001
  num_epochs: 50
  seed: 42
  optimizer: "AdamW"
  weight_decay: 0.0001
  loss_function: "cross_entropy"

validation:
  validation_split: 0.0
