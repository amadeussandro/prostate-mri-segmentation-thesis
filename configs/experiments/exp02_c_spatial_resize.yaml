# Experiment 2 (RQ-1) -- preprocessing ablation, axis C: spatial
# standardization mode = "resize" (interpolated to a fixed size) vs baseline
# "crop_pad" (zero-information-loss padding to the cohort's max native shape).
#
# NOTE: unlike crop_pad at target_size=442 (a pure pad, no cropping, for
# every case in this cohort), resize to 256x256 is lossy (downsamples the
# 270x270 and 442x442 groups) and is NOT exactly invertible for the
# round-trip test (see src/transforms.py module docstring) -- this is an
# expected, deliberate property of this ablation arm, not a bug. Predictions
# from this config must still be inverse-transformed (nearest-neighbour)
# before evaluation in original voxel space, per the thesis protocol; the
# resulting reconstruction will not be pixel-exact the way the baseline's is.

experiment:
  name: "exp02_c_spatial_resize"
  description: "Preprocessing ablation: resize (256x256) vs baseline crop/pad (442x442)"
  output_dir: "./results/exp02_preprocessing/c_spatial_resize"

data:
  dataset_root: "dataset/prostate158_train/train"
  train_csv: "dataset/prostate158_train/train.csv"
  valid_csv: "dataset/prostate158_train/valid.csv"
  target_mask: "t2_anatomy_reader1.nii.gz"
  slice_sampling: "all"

preprocessing:
  normalization: "per_volume"
  z_resample: false
  spatial_mode: "resize"       # <-- ablated axis (baseline: crop_pad)
  target_size: [256, 256]

model:
  architecture: "ProstateUNet2D"
  in_channels: 1
  out_channels: 3
  init_features: 32
  dropout_rate: 0.2

training:
  batch_size: 8   # kept identical to baseline/exp02_a/exp02_b -- only preprocessing may vary in Experiment 2
  learning_rate: 0.001
  num_epochs: 100
  seed: 42
  optimizer: "AdamW"
  weight_decay: 0.0001
  loss_function: "cross_entropy"

validation:
  eval_every_n_epochs: 1
  save_best_metric: "val_dice"

# NOTE: the fields below are currently DECLARATIVE / documentation-only.
# src/evaluate.py's functions (evaluate_cases, evaluate_patient_protocols)
# take aggregation/space/class_ids as explicit Python arguments; nothing
# reads this block automatically yet. Kept here so the intended protocol
# for this experiment is written down next to it, not to imply an
# orchestration layer exists. Wire these in only if doing so stays small.
evaluation:
  aggregation: "per_case"
  space: "original_voxel"
  include_empty_slices: true
  class_ids: [0, 1, 2]
  label_mapping_status: "unverified"
