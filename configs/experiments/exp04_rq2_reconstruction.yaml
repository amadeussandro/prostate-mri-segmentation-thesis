# RQ2 -- 3D reconstruction of the FROZEN 2D U-Net's predictions (inference only).
#
# Thesis RQ2: "Bagaimana Implementasi Rekonstruksi 3D Citra MRI Pasien Kanker
# Prostat dari hasil Segmentasi 2D U-Net?"
#
# This file is DECLARATIVE / documentation-only, matching the convention of
# exp04_reconstruction_analysis.yaml. The runnable entry point is
# scripts/run_rq2_reconstruction.py, which takes the actual preprocessing, model
# architecture, and official split from configs/config_baseline.yaml AND the
# checkpoint's own embedded config (so inference matches how the weights were
# trained). No training, no retraining, no checkpoint mutation.
#
# It does NOT retrain, change the model/hyperparameters/split, overwrite
# results/exp01_baseline, or alter the frozen RQ1 result.

task: "RQ2_3d_reconstruction"
# The frozen RQ1 candidate: E1 (Dice + Cross Entropy), epoch 88, selected on the
# 20 official validation cases and evaluated once on the held-out test set.
# Identity is verified by SHA-256 before inference, not by filename.
source_checkpoint: "./results/exp_e1_dice_ce/best_model.pt"
source_checkpoint_sha256: "2366e3c68f5ec616b19c0e7df39f9135898fd287b9436ce5dfab7baf8528d5d2"
source_checkpoint_epoch: 88
source_experiment: "exp_e1_dice_ce"
base_config: "configs/experiments/exp_e1_dice_ce.yaml"         # preprocessing + model + official split
# Isolated output. results/exp04_reconstruction/ holds the earlier Baseline
# epoch-77 run and is NOT overwritten -- it remains available as a comparison.
output_dir: "./results/rq2_e1_epoch88"
split: "test"                                                  # official held-out 19-case test set
class_ids: [0, 1, 2]

# Label mapping VERIFIED 2026-10-05 by multi-planar visual inspection
# (axial/coronal/sagittal; cases 020, 059, 099, 139). Never changed here.
# Record: results/label_mapping/label_mapping_verified.md
label_mapping_status: "verified_multiplanar_2026_10_05"
# NOTE: the historical Baseline epoch-77 RQ2 run lives in
# results/exp04_reconstruction/ and must not be presented as an E1 result.
class_names:
  0: "background"
  1: "CG_central_gland"    # Central Gland (CG = CZ + TZ)
  2: "PZ_peripheral_zone"  # Peripheral Zone

evaluation:
  space: "original_voxel"   # reconstruct + inverse-transform prediction to original grid
  aggregation: "per_case"   # per-case metrics first, then mean +/- SD across the 19 cases
  ground_truth: "original_on_disk_mask_untouched"
  metrics: ["dice", "iou", "hd95_mm", "asd_mm", "precision", "recall"]

# Reminder: the round-trip fidelity result (scripts/roundtrip_test.py, Dice = 1.0)
# validates the reconstruction TRANSFORM only -- it is NOT the model's accuracy.
roundtrip_fidelity_note: "Dice=1.0 is reconstruction-transform fidelity, not model segmentation accuracy."
