# Experiment 2 (RQ-1) -- preprocessing ablation, axis B: normalization
# strategy = "global" (training-set pooled statistics) vs baseline
# "per_volume" (each case normalized against its own intensity distribution).
#
# global_stats are NOT hardcoded here. When normalization == "global" and no
# explicit stats are supplied, src/train.py::_ensure_global_stats computes them
# from the TRAINING split ONLY (leakage-safe) and injects them into the config,
# and they are then saved inside the checkpoint so evaluation reuses the exact
# same train-derived stats. This is deterministic (fixed subsampling seed) and
# removes the previous manual "paste four numbers" step. If you ever want to
# pin specific stats, add a global_stats: {p_low, p_high, mean, std} block and
# they will be respected instead of recomputed.

experiment:
  name: "exp02_b_normalization_global"
  description: "Preprocessing ablation: global (train-set) intensity normalization vs baseline per-volume"
  output_dir: "./results/exp02_preprocessing/b_normalization_global"

data:
  dataset_root: "dataset/prostate158_train/train"
  train_csv: "dataset/prostate158_train/train.csv"
  valid_csv: "dataset/prostate158_train/valid.csv"
  target_mask: "t2_anatomy_reader1.nii.gz"
  slice_sampling: "all"

preprocessing:
  normalization: "global"      # <-- ablated axis (baseline: per_volume)
  # global_stats auto-computed from the training split (see header note).
  z_resample: false
  spatial_mode: "crop_pad"
  target_size: [442, 442]

model:
  architecture: "ProstateUNet2D"
  in_channels: 1
  out_channels: 3
  init_features: 32
  dropout_rate: 0.2

training:
  batch_size: 8
  learning_rate: 0.001
  num_epochs: 100
  seed: 42
  optimizer: "AdamW"
  weight_decay: 0.0001
  loss_function: "cross_entropy"

validation:
  eval_every_n_epochs: 1
  save_best_metric: "val_dice"

# NOTE: the fields below are currently DECLARATIVE / documentation-only.
# src/evaluate.py's functions (evaluate_cases, evaluate_patient_protocols)
# take aggregation/space/class_ids as explicit Python arguments; nothing
# reads this block automatically yet. Kept here so the intended protocol
# for this experiment is written down next to it, not to imply an
# orchestration layer exists. Wire these in only if doing so stays small.
evaluation:
  aggregation: "per_case"
  space: "original_voxel"
  include_empty_slices: true
  class_ids: [0, 1, 2]
  label_mapping_status: "unverified"
